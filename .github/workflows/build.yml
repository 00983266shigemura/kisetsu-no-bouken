name: Build iOS 10-compatible static app (read-only)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install fixed build dependency
        run: npm install --no-save --ignore-scripts typescript@5.9.3
      - name: Build and test
        run: |
          node build.js
          node test.js
      - name: Confirm generated content matches source
        run: git diff --exit-code -- index.html sw.js offline.appcache
