name: Build iOS 10-compatible static app
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
      - name: Install locked build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify isolated builds, regression and committed outputs
        run: npm test
