name: Verify published app and iOS 10 offline support
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cp-verify-public
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
      - name: Check deployed release and file checksums against triggering commit
        shell: bash
        env:
          APP_BASE: https://00983266shigemura.github.io/kisetsu-no-bouken/
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if node scripts/verify-public.cjs; then
              echo "PASS: verified deployed release and file checksums"
              exit 0
            fi
            echo "Pages propagation pending or mismatch ($attempt/18)"
            sleep 10
          done
          echo 'PROD_VERIFY_FAIL: expected release remains unavailable'
          exit 1
