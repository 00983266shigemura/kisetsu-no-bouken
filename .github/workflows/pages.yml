name: Deploy and verify GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sw.js"
      - "offline.appcache"
      - "icon.svg"
      - "manifest.webmanifest"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare publish directory
        run: |
          mkdir -p _site
          cp index.html sw.js offline.appcache icon.svg manifest.webmanifest .nojekyll _site/
          test -s _site/index.html
          test -s _site/offline.appcache
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public HTTP, app markup and iOS 10 AppCache MIME
        run: |
          set -euo pipefail
          BASE="https://00983266shigemura.github.io/kisetsu-no-bouken"
          for i in $(seq 1 12); do
            STATUS=$(curl -sSL -o /tmp/kisetsu-index -w '%{http_code}' "$BASE/" || true)
            if [ "$STATUS" = "200" ] && grep -q 'きせつのぼうけん' /tmp/kisetsu-index; then break; fi
            echo "Waiting for Pages: attempt $i HTTP $STATUS"
            sleep 10
          done
          test "$STATUS" = 200
          grep -q 'manifest="./offline.appcache"' /tmp/kisetsu-index
          curl -fsSL -D /tmp/kisetsu-headers -o /tmp/kisetsu-cache "$BASE/offline.appcache"
          grep -q '^CACHE MANIFEST' /tmp/kisetsu-cache
          if grep -qi '^content-type: *text/cache-manifest' /tmp/kisetsu-headers; then
            echo "PASS: iOS 10 Application Cache MIME text/cache-manifest"
          else
            echo "FAIL: AppCache MIME header is not text/cache-manifest"
            cat /tmp/kisetsu-headers
            exit 1
          fi
          for file in icon.svg sw.js manifest.webmanifest; do
            curl -fsSL -o /dev/null "$BASE/$file"
          done
          echo "PASS: GitHub Pages HTTP/HTML/AppCache/assets: $BASE/"
